pre-commit:
  parallel: true
  jobs:
    - name: lint
      glob: "*.{ts,js}"
      run: npm run -s lint
    - name: typecheck
      glob: "*.ts"
      run: npm run -s typecheck
commit-msg:
  jobs:
    - name: commitlint
      run: npx commitlint --edit {1}
pre-push:
  jobs:
    - name: check
      run: npm run -s check
