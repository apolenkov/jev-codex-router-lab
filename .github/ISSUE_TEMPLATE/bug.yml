name: Bug report
description: Report a reproducible problem with the router lab
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private data, or raw provider responses.
        Report security issues through a private advisory instead.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: This report contains only public, synthetic, or anonymized data.
          required: true
        - label: This is not a security vulnerability.
          required: true
  - type: input
    id: revision
    attributes:
      label: Revision
      description: Commit SHA or version where the problem occurs.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node.js version, operating system, and relevant tool versions.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use a synthetic input and include the exact commands.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include only sanitized output; never paste credentials or raw private payloads.
    validations:
      required: true
